[package]
name = "nord-bits-derive"
categories = ["development-tools::procedural-macro-helpers"]
description = "The proc-macro behind nord-format: bit-packed binary layouts declared once"
edition.workspace = true
rust-version.workspace = true
keywords = ["bitfield", "nord", "proc-macro"]
license.workspace = true
repository.workspace = true
version = "0.5.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
