[package]
name = "nord-bits-derive"
categories = ["development-tools::procedural-macro-helpers"]
description = "Declarative bit-packed panel definitions for nord-format"
edition.workspace = true
keywords = ["bitfield", "nord", "proc-macro"]
license.workspace = true
repository.workspace = true
version = "0.1.0"

[lib]
proc-macro = true

# All three are already in the workspace lockfile via `binrw_derive`, so this
# crate adds no new transitive dependency — only a compile-time one.
[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
