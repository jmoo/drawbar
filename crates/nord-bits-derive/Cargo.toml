[package]
name = "nord-bits-derive"
description = "Declarative bit-packed panel definitions for nord-format"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
proc-macro = true

# All three are already in the workspace lockfile via `binrw_derive`, so this
# crate adds no new transitive dependency — only a compile-time one.
[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
