[package]
name = "drawbar"
description = "Your Nord's sounds, in a window: browse, edit and send programs, samples and pianos, in the browser or on the desktop"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version = "0.10.0"

# The browser suite the Nix build runs headless in Chromium and Firefox.
[package.metadata.nix]
browserTests = ["web"]

[lib]
# `cdylib` is what wasm-bindgen consumes; `rlib` is what the native binary links.
crate-type = ["cdylib", "rlib"]
name = "drawbar"

[[bin]]
name = "drawbar"
path = "src/main.rs"

# A headless probe of a library folder, for checking that synced copies converge. The
# app never enables it.
[[example]]
name = "sync_probe"
required-features = ["sync-probe"]

[features]
sync-probe = []

[dependencies]
# glow (WebGL2 / OpenGL) makes a smaller wasm module than the default wgpu backend,
# and every browser with WebUSB has WebGL2.
eframe = { version = "0.32", default-features = false, features = [
  "glow",
  "persistence",
  "wayland",
  "x11",
] }
egui_extras = { version = "0.32", default-features = false, features = ["svg"] }
# Hack alone, for the monospace family. eframe's `default_fonts` would add it with
# Ubuntu Light and two emoji faces; `app::fonts` names the faces it wants instead.
epaint_default_fonts = "0.32"
nord-format = { path = "../nord-format", version = "0.8.0", features = [
  "bundle",
] }
# `file-handle-inner`: a picked file is copied into the library from its path, or from
# the browser's `File`, never read whole first.
rfd = { version = "0.15", features = ["file-handle-inner"] }
# The list drawbar 0.10 kept in eframe's store, read once. ron already builds it.
base64 = "0.22"
# Drafts of edits, and the derived cache. eframe's `persistence` already builds both.
ron = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
# The messages between the page and the browser library's worker. toshokan builds it.
serde_json = "1"
# The library's facts, beside its files.
toshokan = { path = "../toshokan", version = "0.1.0" }
# A file's identity, and the name of a library's local root. toshokan builds it.
blake3 = { version = "1", features = ["serde"] }
# Names compared as macOS and Windows compare them: in one normalization form.
unicode-normalization = "0.1"

[dev-dependencies]
# `synthetic` lays out a piano library from a description: the piano editor's tests
# need a `.npno` and nothing else in the workspace builds one without a template.
nord-format = { path = "../nord-format", version = "0.8.0", features = [
  "synthetic",
] }
# Read drawbar's own source, to find every character its text needs a glyph for.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", default-features = false }
# An independent reader and writer for the copies of a library drawbar saves and opens.
# nord-format's `bundle` already builds it.
zip = { version = "9", default-features = false, features = ["deflate"] }

# The browser suite, run by wasm-bindgen-cli's test runner.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# MIDI input only. drawbar opens no output port.
midir = "0.11"
nord-usb = { path = "../nord-usb", version = "0.8.0", features = [
  "blocking",
  "nusb",
] }
# `playback` alone: the decoders are for files, and drawbar feeds it raw samples.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
# HTTPS for `net`. `ring` is the crypto provider, and the trusted roots are
# the system's own rather than a bundled set.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-native-certs = "0.8"
ureq = { version = "3.4", default-features = false, features = [
  "rustls-no-provider",
] }
# The `file:` URL that shows the library's folder. eframe already builds it.
url = "2"

[target.'cfg(unix)'.dependencies]
# The local time zone's offset, for the dates drawbar shows. eframe and toshokan
# already build it.
libc = "0.2"
# The open-file limit, raised at start. Linux builds already ship it, through eframe.
rustix = { version = "1", features = ["fs", "process"] }

# The local time zone's offset, for the dates drawbar shows. toshokan already builds it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Time",
] }

# The native menu bar, and the title bar the traffic lights sit in. macOS only:
# elsewhere the menus and window buttons are drawn in the window.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSResponder",
  "NSToolbar",
  "NSView",
  "NSWindow",
  "std",
] }
raw-window-handle = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# The library's storage in the browser, which the library's worker performs.
toshokan = { path = "../toshokan", version = "0.1.0", features = ["web"] }
# Exact: `wasm-bindgen-cli` must match this version, and the Nix build takes the CLI
# nixpkgs ships, so this pin follows nixpkgs (see overlay.nix).
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioContext",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BaseAudioContext",
  "Blob",
  "BlobPropertyBag",
  "Crypto",
  "DataTransfer",
  "DedicatedWorkerGlobalScope",
  "DirectoryPickerOptions",
  "Document",
  "DomRect",
  "DomStringList",
  "DomException",
  "DragEvent",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemHandle",
  "FileSystemHandleKind",
  "FileSystemHandlePermissionDescriptor",
  "FileSystemPermissionMode",
  "FileSystemWritableFileStream",
  "Headers",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "IdbDatabase",
  "IdbFactory",
  "IdbKeyRange",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "Location",
  "Lock",
  "LockManager",
  "LockOptions",
  "MessageEvent",
  "MidiAccess",
  "MidiInput",
  "MidiInputMap",
  "MidiMessageEvent",
  "MidiPort",
  "MouseEvent",
  "Navigator",
  "Performance",
  "Request",
  "RequestInit",
  "Response",
  "Storage",
  "StorageManager",
  "Url",
  "Usb",
  "UsbConnectionEvent",
  "UsbDevice",
  "UsbDeviceFilter",
  "UsbDeviceRequestOptions",
  "Window",
  "Worker",
  "WorkerOptions",
  "WorkerType",
  "WritableStream",
] }
nord-usb = { path = "../nord-usb", version = "0.8.0", default-features = false, features = [
  "web",
] }
