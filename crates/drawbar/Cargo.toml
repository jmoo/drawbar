[package]
name = "drawbar"
description = "Desktop and browser app for Clavia / Nord keyboards — view, edit, and transfer sounds over USB"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version = "0.2.0"

[lib]
# `cdylib` is what wasm-bindgen consumes; `rlib` is what the native binary links.
crate-type = ["cdylib", "rlib"]
name = "drawbar"

[[bin]]
name = "drawbar"
path = "src/main.rs"

[dependencies]
# glow (WebGL2 / OpenGL) rather than the default wgpu backend: it is the smaller
# wasm module, and the browsers that have WebUSB all have WebGL2.
eframe = { version = "0.32", default-features = false, features = [
  "default_fonts",
  "glow",
  "persistence",
  "wayland",
  "x11",
] }
nord-format = { path = "../nord-format", version = "0.2.0", features = [
  "bundle",
] }
rfd = "0.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nord-usb = { path = "../nord-usb", version = "0.2.1", features = [
  "blocking",
  "nusb",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# Exact: the Nix build's `wasm-bindgen-cli` is pinned to match it (see overlay.nix).
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "Document",
  "Element",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "Navigator",
  "Url",
  "Usb",
  "UsbConnectionEvent",
  "UsbDevice",
  "UsbDeviceFilter",
  "UsbDeviceRequestOptions",
  "Window",
] }
nord-usb = { path = "../nord-usb", version = "0.2.1", default-features = false, features = [
  "web",
] }
