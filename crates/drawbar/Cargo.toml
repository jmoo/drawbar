[package]
name = "drawbar"
description = "Your Nord's sounds, in a window: browse, edit and send programs, samples and pianos, in the browser or on the desktop"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true
version = "0.9.1"

[lib]
# `cdylib` is what wasm-bindgen consumes; `rlib` is what the native binary links.
crate-type = ["cdylib", "rlib"]
name = "drawbar"

[[bin]]
name = "drawbar"
path = "src/main.rs"

[dependencies]
# glow (WebGL2 / OpenGL) makes a smaller wasm module than the default wgpu backend,
# and every browser with WebUSB has WebGL2.
eframe = { version = "0.32", default-features = false, features = [
  "default_fonts",
  "glow",
  "persistence",
  "wayland",
  "x11",
] }
egui_extras = { version = "0.32", default-features = false, features = ["svg"] }
nord-format = { path = "../nord-format", version = "0.7.1", features = [
  "bundle",
] }
# `file-handle-inner`: a picked file is copied into the library from its path, or from
# the browser's `File`, never read whole first.
rfd = { version = "0.15", features = ["file-handle-inner"] }
# The library's index. eframe's `persistence` already builds both.
ron = "0.10"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# `synthetic` lays out a piano library from a description: the piano editor's tests
# need a `.npno` and nothing else in the workspace builds one without a template.
nord-format = { path = "../nord-format", version = "0.7.1", features = [
  "synthetic",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# MIDI input only. drawbar opens no output port.
midir = "0.11"
nord-usb = { path = "../nord-usb", version = "0.7.1", features = [
  "blocking",
  "nusb",
] }
# `playback` alone: the decoders are for files, and drawbar feeds it raw samples.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
# The `file:` URL that shows the library's folder. eframe already builds it.
url = "2"

[target.'cfg(unix)'.dependencies]
# The open-file limit, raised at start. Linux builds already ship it, through eframe.
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# Exact: `wasm-bindgen-cli` must match this version, and the Nix build takes the CLI
# nixpkgs ships, so this pin follows nixpkgs (see overlay.nix).
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioContext",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BaseAudioContext",
  "Blob",
  "BlobPropertyBag",
  "DataTransfer",
  "DirectoryPickerOptions",
  "Document",
  "DomRect",
  "DomStringList",
  "DomException",
  "DragEvent",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemHandle",
  "FileSystemHandleKind",
  "FileSystemHandlePermissionDescriptor",
  "FileSystemPermissionMode",
  "FileSystemWritableFileStream",
  "Headers",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "IdbDatabase",
  "IdbFactory",
  "IdbKeyRange",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "Lock",
  "LockManager",
  "LockOptions",
  "MessageEvent",
  "MidiAccess",
  "MidiInput",
  "MidiInputMap",
  "MidiMessageEvent",
  "MidiPort",
  "MouseEvent",
  "Navigator",
  "Performance",
  "Request",
  "RequestInit",
  "Response",
  "Storage",
  "StorageManager",
  "Url",
  "Usb",
  "UsbConnectionEvent",
  "UsbDevice",
  "UsbDeviceFilter",
  "UsbDeviceRequestOptions",
  "Window",
  "Worker",
  "WritableStream",
] }
nord-usb = { path = "../nord-usb", version = "0.7.1", default-features = false, features = [
  "web",
] }
