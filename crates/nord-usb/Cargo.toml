[package]
name = "nord-usb"
description = "Talk to Clavia / Nord keyboards over USB — the vendor protocol behind Nord Sound Manager, on desktop and in the browser"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version = "0.2.1"

[lib]
name = "nord_usb"

# Features the Nix build must enable when running tests.
[package.metadata.nix]
testFeatures = ["blocking", "replay"]

[features]
default = ["nusb"]

# Desktop backend: macOS (IOKit), Linux (usbfs), Windows (WinUSB).
nusb = ["dep:nusb"]

web = [
  "dep:web-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
]

# Drive the protocol from committed captures, with no hardware.
replay = []

# Deliberate protocol and transfer-shape faults for reverse engineering. Off by default:
# a wrong value can stall the instrument's bulk endpoints.
fault-injection = []

# Block on the async API from synchronous callers (the CLI). Tiny; not a runtime.
blocking = ["dep:pollster"]

# Corpus-backed replay tests (NORD_CORPUS_ROOT), mirroring nord-format.
corpus = ["replay"]

[dependencies]
nord-format = { path = "../nord-format", version = "0.2.0" }
thiserror = "2"
pollster = { version = "0.4", optional = true }

nusb = { version = "0.1", optional = true }

wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

# Only the device-side interfaces: enumeration (`Usb`, `UsbDeviceRequestOptions`, …)
# needs a user gesture and therefore lives in the page, not here.
web-sys = { version = "0.3", optional = true, features = [
  "UsbAlternateInterface",
  "UsbConfiguration",
  "UsbDevice",
  "UsbInTransferResult",
  "UsbInterface",
  "UsbOutTransferResult",
  "UsbTransferStatus",
] }

# The deadline tests block on futures whatever features are on, so the test
# build always carries pollster — `--features replay` alone must compile, as
# both READMEs and the replay guard instruct.
[dev-dependencies]
libtest-mimic = "0.8"
pollster = "0.4"

# The replay sweep builds its own test list — one trial per script — so it owns its
# harness. It reads the committed scripts on every run and the corpus with the feature
# on, and needs the transport those scripts drive.
[[test]]
name = "replay"
harness = false
required-features = ["replay"]

# The bench probe drives real hardware; targets without the desktop transport
# (wasm, wasi) must skip it.
[[example]]
name = "write_probe"
required-features = ["nusb", "blocking"]
