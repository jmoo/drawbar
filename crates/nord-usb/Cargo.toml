[package]
name = "nord-usb"
description = "Clavia / Nord device transport and vendor protocol over USB"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "nord_usb"

[features]
default = ["nusb"]
# Desktop backend: macOS (IOKit), Linux (usbfs), Windows (WinUSB). Pure Rust, so
# no C toolchain and no cross-compilation grief.
nusb = ["dep:nusb"]
# Browser backend. Chrome/Edge only -- Firefox and Safari have declined WebUSB.
web = ["dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
# Drive the protocol from committed corpus captures, with no hardware. Used by
# the golden-shape tests; platform-independent, so it runs on wasm32 too.
replay = []
# Corpus-backed golden shape tests (NORD_CORPUS_DIR), mirroring nord-format.
corpus = ["replay"]

[dependencies]
nord-format = { path = "../nord-format" }
thiserror = "2"

nusb = { version = "0.1", optional = true }

wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Usb", "UsbDevice", "UsbInTransferResult", "UsbOutTransferResult"] }
