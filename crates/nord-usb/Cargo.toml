[package]
name = "nord-usb"
description = "Clavia / Nord device transport and vendor protocol over USB"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "nord_usb"

# Features the Nix build must enable when running tests. The golden replay tests in
# `tests/ops.rs` and `tests/status.rs` are `#![cfg(feature = "replay")]`, and `replay`
# is deliberately not a default feature — without this they compile to nothing and the
# build reports a pass having verified none of the wire encoding.
[package.metadata.nix]
testFeatures = ["replay"]

[features]
default = ["nusb"]
# Desktop backend: macOS (IOKit), Linux (usbfs), Windows (WinUSB). Pure Rust, so
# no C toolchain and no cross-compilation grief.
nusb = ["dep:nusb"]
# Browser backend, over WebUSB. Hardware-verified for the read-only path (Chrome on
# macOS: inventory, object info); writes and multi-chunk bulk reads not yet exercised.
# Chrome/Edge only -- Firefox and Safari have declined WebUSB.
web = [
  "dep:web-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
]
# Drive the protocol from committed corpus captures, with no hardware. Used by
# the golden-shape tests; platform-independent, so it runs on wasm32 too.
replay = []
# Block on the async API from synchronous callers (the CLI). Tiny; not a runtime.
blocking = ["dep:pollster"]
# Corpus-backed golden shape tests (NORD_CORPUS_DIR), mirroring nord-format.
corpus = ["replay"]

[dependencies]
nord-format = { path = "../nord-format" }
thiserror = "2"
pollster = { version = "0.4", optional = true }

nusb = { version = "0.1", optional = true }

wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
# Only the device-side interfaces: enumeration (`Usb`, `UsbDeviceRequestOptions`, …)
# needs a user gesture and therefore lives in the page, not here.
web-sys = { version = "0.3", optional = true, features = [
  "UsbAlternateInterface",
  "UsbConfiguration",
  "UsbDevice",
  "UsbInTransferResult",
  "UsbInterface",
  "UsbOutTransferResult",
  "UsbTransferStatus",
] }
