[package]
name = "nord-cli"
description = "Your Nord from the terminal: inspect, edit and move the sounds in Nord files and on a connected instrument"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version = "0.9.0"

[[bin]]
name = "nord"
path = "src/main.rs"

[features]
# `nord device wedge`, which puts the instrument into its known-bad state so recovery
# can be tested against it. Off by default, because it breaks the attached instrument.
# `nord device recover` undoes it and always ships.
wedge = []

# `NORD_FAIL_AFTER_DELETE`, which makes a replace fail after the slot is deleted and the
# backup is in hand. The restore and rescue paths exist for that state, which is otherwise
# reachable only by pulling the cable within a few milliseconds. Off by default, like
# `wedge`, because it deletes a slot.
fault-injection = ["nord-usb/fault-injection"]

[dependencies]
clap = { version = "4", features = ["derive"] }
# Line editing for `--sweep`, which prefills each prompt with the previous answer. The
# terminal's own line discipline cannot be given a starting buffer. Default features are
# off because the password, editor and fuzzy prompts are unused.
dialoguer = { version = "0.12", default-features = false }
# `bundle` lets `nord inspect` read ZIP bundles and backups.
nord-format = { path = "../nord-format", version = "0.9.0", features = [
  "bundle",
] }
nord-usb = { path = "../nord-usb", version = "0.9.0", features = [
  "blocking",
  "replay",
] }
npno-prep = { path = "../npno-prep", version = "0.1.0" }
