\* Violates ForksFromFiles: without forks found through certificates, once the original has moved two entries past a fork and compacted, only a reader's memory still shows the fork.
SPECIFICATION Spec
CONSTANTS
  Instances = {a, b}
  MaxEntries = 4
  MaxFiles = 5
  MaxEffects = 0
  MaxChaos = 0
  MaxClones = 1
  MaxLosses = 0
  MaxWriters = 1
  MaxRestores = 0
  MaxDrops = 0
  Certify = TRUE
  Carry = TRUE
  Numbered = TRUE
  CertForks = FALSE
  Grace = FALSE
  Guard = TRUE
  UniqueNames = TRUE
  SealedOnly = TRUE
  FoldedOnly = TRUE
  CheckFirst = TRUE
INVARIANT
  ForksFromFiles
CHECK_DEADLOCK FALSE
