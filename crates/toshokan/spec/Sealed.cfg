\* Violates Retained: a clone deletes the segment the original still has open, and the original's next entry with it.
SPECIFICATION Spec
CONSTANTS
  Instances = {a, b}
  MaxEntries = 3
  MaxFiles = 5
  MaxEffects = 0
  MaxChaos = 0
  MaxClones = 1
  MaxLosses = 0
  MaxWriters = 2
  MaxRestores = 0
  FoldHashes = TRUE
  UniqueNames = TRUE
  SealedOnly = FALSE
  FoldedOnly = TRUE
  CheckFirst = TRUE
INVARIANT
  Retained
CHECK_DEADLOCK FALSE
