\* Violates NoSpuriousConflict: a snapshot that certifies no files leaves a segment below its anchor undeletable, and a reader shows its folded lines as a run.
SPECIFICATION Spec
CONSTANTS
  Instances = {a, b}
  MaxEntries = 2
  MaxFiles = 3
  MaxEffects = 0
  MaxChaos = 0
  MaxClones = 0
  MaxLosses = 0
  MaxWriters = 1
  MaxRestores = 0
  MaxDrops = 0
  Certify = FALSE
  Carry = TRUE
  Numbered = TRUE
  CertForks = TRUE
  Grace = FALSE
  Guard = TRUE
  UniqueNames = TRUE
  SealedOnly = TRUE
  FoldedOnly = TRUE
  CheckFirst = TRUE
INVARIANT
  NoSpuriousConflict
CHECK_DEADLOCK FALSE
