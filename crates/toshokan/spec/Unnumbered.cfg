\* Violates NoReapply: placing by predecessor alone places again an entry of a deleted segment that a snapshot folds.
SPECIFICATION Spec
CONSTANTS
  Instances = {a, b}
  MaxEntries = 3
  MaxFiles = 4
  MaxEffects = 0
  MaxChaos = 0
  MaxClones = 0
  MaxLosses = 0
  MaxWriters = 1
  MaxRestores = 0
  Window = 1
  Certify = TRUE
  Numbered = FALSE
  Classify = TRUE
  Grace = FALSE
  UniqueNames = TRUE
  SealedOnly = TRUE
  FoldedOnly = TRUE
  CheckFirst = TRUE
INVARIANT
  NoReapply
CHECK_DEADLOCK FALSE
