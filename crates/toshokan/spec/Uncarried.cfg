  Instances = {a, b}
  MaxEntries = 3
  MaxFiles = 5
  MaxEffects = 0
  MaxChaos = 0
  MaxClones = 0
  MaxLosses = 0
  MaxWriters = 1
  MaxRestores = 0
  MaxDrops = 0
  ResumeMid = FALSE
  Certify = TRUE
  Carry = FALSE
  Numbered = TRUE
  CertForks = TRUE
  Quarantine = TRUE
  UniqueNames = TRUE
  SealedOnly = TRUE
  FoldedOnly = TRUE
  CheckFirst = TRUE
  SettleFirst = TRUE
INVARIANT
  NoSpuriousConflict
CHECK_DEADLOCK FALSE
