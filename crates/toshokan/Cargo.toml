[package]
name = "toshokan"
description = "Keep what a file cannot say about itself beside the file, for every writer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true
version = "0.1.0"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# A rename that refuses to replace its destination, atomically.
[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"
