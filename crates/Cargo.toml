[workspace]
members = [
  "drawbar",
  "nord-bits-derive",
  "nord-cli",
  "nord-format",
  "nord-model",
  "nord-usb",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/jmoo/drawbar"
# Default version for unpublished crates
version = "0.1.0"

# Cargo profiles only take effect at the workspace root.
[profile.release]
lto = true
strip = true

# Optimize wasm package
[profile.web]
codegen-units = 1
inherits = "release"
opt-level = "z"
panic = "abort"
