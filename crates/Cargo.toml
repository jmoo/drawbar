[workspace]
members = [
  "drawbar",
  "nord-bits-derive",
  "nord-cli",
  "nord-format",
  "nord-usb",
  "toshokan",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
# `File::try_lock`, which toshokan's writer lock takes.
rust-version = "1.89"
repository = "https://github.com/jmoo/drawbar"

# Cargo profiles only take effect at the workspace root.
[profile.release]
lto = true
strip = true

# The size-optimized profile for the wasm package.
[profile.web]
codegen-units = 1
inherits = "release"
opt-level = "z"
panic = "abort"
