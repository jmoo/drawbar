[package]
name = "nord-format"
categories = ["encoding", "parser-implementations"]
description = "Parse and write Clavia / Nord keyboard binary file formats (Electro 5, …)"
edition.workspace = true
keywords = ["clavia", "electro", "nord", "parser"]
license.workspace = true
repository.workspace = true
version = "0.1.0"

[lib]
name = "nord_format"

[features]
default = []
# ZIP-based backup bundles pull in the `zip` stack; opt in with `--features
# bundle`. Off by default so parse-only consumers (and the corpus round-trip
# tests, which never touch bundles) stay lean.
bundle = ["dep:zip"]
# The corpus-backed round-trip/decode tests (tests/ne5.rs) need the private
# specimen corpus (NORD_CORPUS_DIR). Off by default so the open minimal suite
# runs anywhere; the Nix `nord-format-corpus` check enables it. Test-only.
corpus = []

# ⚠️ Pinned `=`: `#[bitbody]`-generated code names nord-format internals, so a
# registry build must expand exactly the derive version this source was written
# against. When the derive changes, publish it first, then bump this pin.
[dependencies]
nord-bits-derive = { path = "../nord-bits-derive", version = "=0.1.0" }
crcxx = "0.3.1"
thiserror = "2"
zip = { version = "2", optional = true, default-features = false, features = [
  "deflate",
] }

[dev-dependencies]
regex = "1"

# `corpus` is excluded: test-only, and useless without the private specimens.
[package.metadata.docs.rs]
features = ["bundle"]
