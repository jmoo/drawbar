[package]
name = "nord-format"
categories = ["encoding", "parser-implementations"]
description = "Read and write Clavia / Nord keyboard file formats — programs, samples, set lists, settings, backups — with byte-exact round-trips"
edition.workspace = true
rust-version.workspace = true
keywords = ["clavia", "electro", "nord", "parser"]
license.workspace = true
repository.workspace = true
version = "0.3.0"

[lib]
name = "nord_format"

# Features the Nix build must enable when running tests. `bundle` gates the ZIP
# backup-bundle tests and the corpus sweep's drum-bank walk; without it both
# compile out and the run passes having read no archive at all. It is what CI
# tests with too.
[package.metadata.nix]
testFeatures = ["bundle"]

[features]
default = []
# ZIP-based backup bundles pull in the `zip` stack; opt in with `--features
# bundle`. Off by default so parse-only consumers stay lean.
bundle = ["dep:zip"]
# Test-only: the suites that read the private corpus (NORD_CORPUS_ROOT). Implies
# `bundle`, because the corpus holds ZIP banks and backups.
corpus = ["bundle"]

# ⚠️ Pinned `=`: `#[bitbody]`-generated code names nord-format internals, so a
# registry build must expand exactly the derive version this source was written
# against. When the derive changes, publish it first, then bump this pin.
[dependencies]
nord-bits-derive = { path = "../nord-bits-derive", version = "=0.2.0" }
crcxx = "0.3.1"
thiserror = "2"
zip = { version = "2", optional = true, default-features = false, features = [
  "deflate",
] }

[dev-dependencies]
libtest-mimic = "0.8"
serde_json = "1"

# The specimen sweep builds its own test list — one trial per file — so it owns
# its harness. It reads the committed fixtures on every run and the corpus with
# the feature on.
[[test]]
name = "corpus"
harness = false

# `corpus` is excluded: test-only, and useless without the private specimens.
[package.metadata.docs.rs]
features = ["bundle"]
