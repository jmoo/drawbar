[package]
name = "nord-format"
categories = ["encoding", "parser-implementations"]
description = "Read and write Nord keyboard files from Rust, byte for byte"
edition.workspace = true
rust-version.workspace = true
keywords = ["clavia", "electro", "nord", "parser"]
license.workspace = true
repository.workspace = true
version = "0.9.0"

[lib]
name = "nord_format"

# Features the Nix build must enable when running tests. Without `bundle`, the
# archive tests and the corpus sweep's drum-bank walk compile out, and the run
# passes having read no archive at all.
[package.metadata.nix]
testFeatures = ["bundle"]

[features]
default = []
# Reads ZIP archives as entities: bundles, backups and Drum banks. Pulls in `zip`.
bundle = ["dep:zip"]
# Test-only: the suites that read the private corpus (NORD_CORPUS_ROOT). Implies
# `bundle`, because the corpus holds ZIP banks and backups.
corpus = ["bundle"]
# Test-only: `npno::synthetic`, a piano library laid out from a description, for
# another crate's tests. This crate's own tests have it whether or not the feature
# is on.
synthetic = []

# ⚠️ Pinned `=`: `#[bitbody]`-generated code names nord-format internals, so a
# registry build must expand exactly the derive version this source was written
# against. When the derive changes, publish it first, then bump this pin.
[dependencies]
nord-bits-derive = { path = "../nord-bits-derive", version = "=0.6.0" }
crcxx = "0.3.1"
npno-prep = { path = "../npno-prep", version = "0.1.0" }
thiserror = "2"
zip = { version = "9", optional = true, default-features = false, features = [
  "deflate",
] }

[dev-dependencies]
libtest-mimic = "0.8"
serde_json = "1"

# The specimen sweep builds its own test list, one trial per file, so it owns
# its harness. It reads the committed fixtures on every run and the corpus with
# the feature on.
[[test]]
name = "corpus"
harness = false

# `corpus` is excluded: test-only, and useless without the private specimens.
[package.metadata.docs.rs]
features = ["bundle"]
