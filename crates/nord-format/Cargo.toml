[package]
name = "nord-format"
categories = ["encoding", "parser-implementations"]
description = "Parse and write Clavia / Nord keyboard binary file formats (Electro 5, …)"
edition.workspace = true
rust-version.workspace = true
keywords = ["clavia", "electro", "nord", "parser"]
license.workspace = true
repository.workspace = true
version = "0.1.0"

[lib]
name = "nord_format"

# Features the Nix build must enable when running tests. `bundle` gates the ZIP
# backup-bundle tests and the corpus sweep's drum-bank walk; without it both
# compile out and the run passes having read no archive at all. It is what CI
# tests with too.
[package.metadata.nix]
testFeatures = ["bundle"]

[features]
default = []
# ZIP-based backup bundles pull in the `zip` stack; opt in with `--features
# bundle`. Off by default so parse-only consumers stay lean.
bundle = ["dep:zip"]
# The corpus-backed sweeps (tests/corpus, tests/decode_sanity,
# tests/decode_snapshot) need the private specimen corpus (NORD_CORPUS_ROOT).
# Off by default so the open minimal suite runs anywhere; the
# Nix `nord-format-corpus` check enables it. Test-only. Implies `bundle`: the
# corpus holds ZIP banks and backups, and a sweep that cannot open them would
# report a pass having read none of them.
corpus = ["bundle"]

# ⚠️ Pinned `=`: `#[bitbody]`-generated code names nord-format internals, so a
# registry build must expand exactly the derive version this source was written
# against. When the derive changes, publish it first, then bump this pin.
[dependencies]
nord-bits-derive = { path = "../nord-bits-derive", version = "=0.1.0" }
crcxx = "0.3.1"
thiserror = "2"
zip = { version = "2", optional = true, default-features = false, features = [
  "deflate",
] }

[dev-dependencies]
libtest-mimic = "0.8"
serde_json = "1"

# The corpus sweep builds its own test list — one trial per specimen — so it
# owns its harness.
[[test]]
name = "corpus"
harness = false
required-features = ["corpus"]

# `corpus` is excluded: test-only, and useless without the private specimens.
[package.metadata.docs.rs]
features = ["bundle"]
