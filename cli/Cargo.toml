[package]
name = "cli"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libnord = { version = "0.1.0", path = "../libnord" }
crcxx = "0.3.1"
modular-bitfield-msb = "0.11.2"
