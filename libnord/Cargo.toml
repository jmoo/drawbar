[package]
name = "libnord"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
binrw = "0.11.1"
bounded-integer = { version = "0.5.6", features = ["types"] }
byteorder = "1.4.3"
crcxx = "0.3.1"
modular-bitfield = "0.11.2"
quick-xml = "0.28.1"
serde = "1.0.159"
zip = "0.6.4"

[lib]
name = "libnord"
path = "src/lib.rs"
