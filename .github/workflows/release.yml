# Cargo.toml is the only source of truth for versions. On every push to master,
# scripts/release.bash publishes each crate whose version has no
# `<crate>-v<version>` tag yet (Trusted Publishing via OIDC — no token secret)
# and creates that tag as a GitHub release with notes from its Conventional
# Commits. Idempotent, so a failed run is fixed by re-running it
# (`workflow_dispatch`). scripts/bump.bash is how versions move.
#
# First-ever publish of a new crate can't use this (Trusted Publishing is
# configured on an existing crate) — publish locally once.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and releases
      id-token: write # OIDC token exchange with crates.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes walk the history back to the previous tag
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The devshell carries the scripts' tools and the pinned toolchain;
      # `nix develop` keeps the caller's env, so the tokens pass through.
      - run: nix develop -c scripts/release.bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
