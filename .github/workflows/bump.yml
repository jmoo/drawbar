# Put the `bump` label on a PR and the versions it calls for get committed to
# the branch: scripts/bump.bash raises every crate to what its commits since its
# last release tag call for, counting the PR title (the squashed commit that will
# land on master) on the crates the diff touches. A manifest already at or past
# that version is left alone, so the run converges as the job re-runs itself on
# every later push or retitle while the label is on.
#
# The app token lets the pushed commit trigger CI and receive its own required
# checks. A GITHUB_TOKEN push would leave those checks waiting on the new head.
name: bump

on:
  pull_request:
    types: [labeled, synchronize, edited]

permissions: {}

jobs:
  bump:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'bump')
      || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'bump'))
    runs-on: ubuntu-latest
    permissions:
      actions: write # cache-nix-action purges superseded caches
      contents: read
    steps:
      - name: same-repo branches only
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::cannot push to a fork — run scripts/bump.bash locally"
          exit 1
      - name: mint an app token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      # The branch itself, not the merge ref: the bump commit is pushed to it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0 # merge-base with the base branch, and the release tags
          token: ${{ steps.token.outputs.token }}
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-bump-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-bump-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-bump-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: bump from the PR title
        # Explicit bash turns pipefail on; the default run shell would let the
        # tee mask a failing bump.
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: nix develop -c scripts/bump.bash --title "$TITLE" --base "$BASE" | tee "$RUNNER_TEMP/bump.log"
      - name: commit and push
        run: |
          if git diff --quiet; then
            echo "already at the right versions"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "$(sed -n 's/^suggested commit: //p' "$RUNNER_TEMP/bump.log")"
          git push
