# Put the `bump` label on a PR and the versions it calls for get committed to
# the branch: scripts/bump.bash reads the level from the PR title (the squashed
# commit that will land on master) and applies it to the crates the diff
# touches, from the versions at the merge-base — so the run converges and the
# job re-runs itself on every later push or retitle while the label is on.
#
# The push uses GITHUB_TOKEN, so it triggers no other workflows: fine, because
# release.yml publishes from the merged result on master, not from this branch.
name: bump

on:
  pull_request:
    types: [labeled, synchronize, edited]

permissions: {}

jobs:
  bump:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'bump')
      || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'bump'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: same-repo branches only
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::cannot push to a fork — run scripts/bump.bash locally"
          exit 1
      # The branch itself, not the merge ref: the bump commit is pushed to it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0 # merge-base with the base branch, and the release tags
      - uses: dtolnay/rust-toolchain@stable
      - name: bump from the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: scripts/bump.bash --title "$TITLE" --base "$BASE" | tee "$RUNNER_TEMP/bump.log"
      - name: commit and push
        run: |
          if git diff --quiet; then
            echo "already at the right versions"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "$(sed -n 's/^suggested commit: //p' "$RUNNER_TEMP/bump.log")"
          git push
