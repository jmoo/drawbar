# toshokan's suite on a hosted Windows runner, where NTFS, its locks and its
# renames are Windows' own rather than Wine's, and antivirus runs beside it.
#
# Outside Nix, since Nix does not run on Windows: rustup installs the Rust that
# nixpkgs pins, and Cargo.lock pins the rest. It runs only when toshokan,
# the lock file or this workflow changes; the cross build in ci.yml runs every
# crate's Windows suite under Wine on every push.
name: windows

on:
  pull_request:
    paths:
      - crates/toshokan/**
      - crates/Cargo.lock
      - .github/workflows/windows.yml
  push:
    branches: [master]
    paths:
      - crates/toshokan/**
      - crates/Cargo.lock
      - .github/workflows/windows.yml

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toshokan:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      # ⚠️ Keep in step with the rustc nixpkgs pins (`nix develop -c rustc --version`).
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo +1.97.1 test --release --locked -p toshokan
