name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix
        with:
          cache: check
      - run: nix flake check --print-build-logs

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        uses: ./.github/actions/nix
        with:
          cache: native
      - if: runner.os != 'Windows'
        run: nix build .#nord.tests --print-build-logs
      # Keep in step with the rustc version in flake.lock's nixpkgs.
      - if: runner.os == 'Windows'
        shell: bash
        working-directory: crates
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup override set 1.97.1
      - if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - if: runner.os == 'Windows'
        shell: bash
        working-directory: crates
        run: bash ../scripts/test.bash

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix
        with:
          cache: web
      - run: nix build .#site .#nord.browser-tests --print-build-logs

  # ⚠️ Corpus outputs contain private vendor bytes. Restore public dependencies;
  # never save this job's store to the public repository's Actions cache.
  corpus:
    if: >-
      github.repository == 'jmoo/drawbar'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_KEY: ${{ secrets.NORD_CORPUS_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: deploy key is present
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::NORD_CORPUS_DEPLOY_KEY is unset; see CONTRIBUTING.md"
            exit 1
          fi
      - uses: ./.github/actions/nix
        with:
          cache: native
          save: "false"
      - name: corpus read access
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >>~/.ssh/known_hosts
      - run: nix build .#nord.all-corpus --print-build-logs

  # `build` is a required status context on master.
  build:
    if: always()
    needs: [native, web, corpus]
    runs-on: ubuntu-latest
    steps:
      - name: required builds passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(to_entries[];
            .value.result == "success"
            or (.key == "corpus" and .value.result == "skipped"))'

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      actions: write # cache-nix-action purges superseded caches
      contents: write # tags and releases
      id-token: write # OIDC token exchange with crates.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes walk the history back to the previous tag
      - uses: ./.github/actions/nix
        with:
          cache: release
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The devshell carries the scripts' tools and the pinned toolchain;
      # `nix develop` keeps the caller's env, so the tokens pass through.
      - run: nix develop -c scripts/release.bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}

  # After release, so a tag created in the same run is the one published.
  #
  # The app is built through the tag's flake, which pins its own nixpkgs and
  # wasm toolchain, so this job keeps a cache of its own rather than restoring
  # the build job's.
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [release, telemetry]
    runs-on: ubuntu-latest
    permissions:
      actions: write # cache-nix-action purges superseded caches
      contents: read
      id-token: write # OIDC token exchange with the Pages deployment
      pages: write
    concurrency:
      cancel-in-progress: false # canceling mid-upload leaves the site partial
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the app comes from the newest drawbar-v* tag
      - uses: ./.github/actions/nix
        with:
          cache: pages
      - run: scripts/site.bash --out site
      # The action tars its path with `--dereference`, so the out-link and the
      # store tree behind it both resolve to real files.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment

  # Pages waits on this, so no app that reports is published before its collector.
  telemetry:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [check, build]
    runs-on: ubuntu-latest
    concurrency:
      cancel-in-progress: false
      group: telemetry
    environment: drawbar-telemetry-deploy
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: js/telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix shell --inputs-from ../.. nixpkgs#wrangler -c wrangler deploy
