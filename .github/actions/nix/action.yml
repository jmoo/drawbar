name: Nix
description: Install Nix and restore a job's store; save only public outputs.
inputs:
  cache:
    description: Cache family
    required: true
  save:
    description: Save the store after the job, unless it runs for a pull request
    default: "true"
  store-size:
    description: Largest store to save
    default: 4G
runs:
  using: composite
  steps:
    - uses: nixbuild/nix-quick-install-action@v35
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true
          max-jobs = 2
          cores = 2
    # ⚠️ A cache saved by a pull request is readable only by that pull request, yet
    # counts toward the repository's 10 GB. Past that, GitHub evicts the least
    # recently used cache, which can be master's.
    # ⚠️ Above `store-size` the save collects garbage first, and only what an out-link
    # roots is safe from it. A second `nix build` in one job replaces the default
    # `result` links of the first.
    - if: inputs.save == 'true' && github.event_name != 'pull_request'
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'crates/Cargo.lock', 'crates/**/Cargo.toml') }}
        restore-prefixes-first-match: nix-${{ inputs.cache }}-${{ runner.os }}-
        gc-max-store-size: ${{ inputs.store-size }}
        purge: true
        purge-prefixes: nix-${{ inputs.cache }}-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never
    - if: inputs.save != 'true' || github.event_name == 'pull_request'
      uses: nix-community/cache-nix-action/restore@v7
      with:
        primary-key: nix-${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'crates/Cargo.lock', 'crates/**/Cargo.toml') }}
        restore-prefixes-first-match: nix-${{ inputs.cache }}-${{ runner.os }}-
