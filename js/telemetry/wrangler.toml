# The collector behind drawbar.app's anonymous reports. See README.md.
name = "drawbar-telemetry"
main = "src/index.js"
compatibility_date = "2026-05-25"
routes = [{ pattern = "t.drawbar.app", custom_domain = true }]
workers_dev = false
# No version is served anywhere but t.drawbar.app.
preview_urls = false

[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "drawbar_events"

[[send_email]]
name = "REPORTS"
destination_address = "reports@drawbar.app"

# Reports from all senders, per minute in each Cloudflare location. The zone's own rule
# limits each address as well.
[[ratelimits]]
name = "REPORT_RATE"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# No request is ever logged: a log line would keep the address the privacy page says is
# never stored.
[observability]
enabled = false
